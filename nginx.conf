# إعداد Nginx بسيط لتقديم Angular SPA - أي مسار مش ملف حقيقي (زي /dashboard, /reports)
# لازم يرجّع index.html عشان Angular Router هو اللي يتصرف فيه (Client-Side Routing)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache قوي لملفات الـ Build اللي أسماءها فيها Hash (بتتغيّر تلقائيًا مع كل نسخة جديدة)
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
