<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card">
  <div class="form-header">
    <h3>{{ (editingSubscription ? 'form.editTitle' : 'form.addTitle') | translate }}</h3>
    <button type="button" class="close-btn" (click)="cancel.emit()">✕</button>
  </div>

  <div class="form-scroll">
    <div class="name-row">
      <label class="name-field">
        {{ 'form.name' | translate }}
        <input
          type="text"
          formControlName="name"
          placeholder="{{ 'form.namePlaceholder' | translate }}"
          [class.field-invalid]="form.controls.name.invalid && form.controls.name.touched" />
      </label>

      <img *ngIf="logoPreviewUrl" [src]="logoPreviewUrl" class="logo-preview" alt="logo" />

      <button
        type="button"
        class="favorite-toggle"
        [class.active]="form.controls.isFavorite.value"
        (click)="form.controls.isFavorite.setValue(!form.controls.isFavorite.value)"
        title="{{ 'form.favorite' | translate }}">
        {{ form.controls.isFavorite.value ? '★' : '☆' }}
      </button>
    </div>

    <div class="field-row">
      <label>
        {{ 'form.price' | translate }}
        <input
          type="number"
          formControlName="price"
          min="0"
          [class.field-invalid]="form.controls.price.invalid && form.controls.price.touched" />
      </label>

      <label class="currency-field">
        {{ 'form.currency' | translate }}
        <select formControlName="currency">
          <option *ngFor="let c of currencies" [value]="c.value">{{ c.label }}</option>
        </select>
      </label>

      <label>
        {{ 'form.billingCycle' | translate }}
        <select formControlName="billingCycle">
          <option *ngFor="let c of billingCycles" [value]="c.value">{{ c.key | translate }}</option>
        </select>
      </label>
    </div>

    <label>
      {{ 'form.renewalDate' | translate }}
      <input
        type="date"
        formControlName="nextRenewalDate"
        [class.field-invalid]="form.controls.nextRenewalDate.invalid && form.controls.nextRenewalDate.touched" />
    </label>

    <div class="field-row">
      <label>
        {{ 'form.category' | translate }}
        <select formControlName="categoryId">
          <option [ngValue]="null">{{ 'form.noCategory' | translate }}</option>
          <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.icon }} {{ c.name | categoryName }}</option>
        </select>
      </label>

      <label>
        {{ 'form.status' | translate }}
        <select formControlName="status">
          <option *ngFor="let s of statuses" [value]="s.value">{{ s.key | translate }}</option>
        </select>
      </label>
    </div>

    <button type="button" class="more-details-toggle" (click)="toggleMoreDetails()">
      {{ (showMoreDetails ? 'form.hideMoreDetails' : 'form.showMoreDetails') | translate }}
      <span class="chevron" [class.open]="showMoreDetails">⌄</span>
    </button>

    <div class="more-details" *ngIf="showMoreDetails">
      <label>
        {{ 'form.description' | translate }}
        <textarea formControlName="description" rows="2" placeholder="{{ 'form.descriptionPlaceholder' | translate }}"></textarea>
      </label>

      <div class="field-row">
        <label>
          {{ 'form.startDate' | translate }}
          <input type="date" formControlName="startDate" />
        </label>

        <label>
          {{ 'form.paymentMethod' | translate }}
          <select formControlName="paymentMethodId">
            <option [ngValue]="null">{{ 'form.noPaymentMethod' | translate }}</option>
            <option *ngFor="let p of paymentMethods" [ngValue]="p.id">{{ p.name }}</option>
          </select>
        </label>
      </div>

      <div class="field-row">
        <label class="icon-input-field">
          {{ 'form.icon' | translate }}
          <input type="text" formControlName="icon" maxlength="4" placeholder="🎬" />
        </label>

        <label class="url-field">
          {{ 'form.websiteUrl' | translate }}
          <input type="url" formControlName="websiteUrl" placeholder="https://..." />
        </label>
      </div>

      <p class="icon-hint" *ngIf="logoPreviewUrl">{{ 'form.iconHint' | translate }}</p>

      <label>
        {{ 'form.notes' | translate }}
        <textarea formControlName="notes" rows="2" placeholder="{{ 'form.notesPlaceholder' | translate }}"></textarea>
      </label>

      <label class="checkbox-label">
        <input type="checkbox" formControlName="autoRenew" />
        {{ 'form.autoRenew' | translate }}
      </label>

      <div class="tags-field">
        <p class="tags-label">{{ 'form.tags' | translate }}</p>
        <div class="tags-chips">
          <button
            type="button"
            *ngFor="let t of allTags"
            class="tag-chip"
            [class.selected]="isTagSelected(t.id)"
            [style.border-color]="t.color"
            [style.background]="isTagSelected(t.id) ? t.color + '22' : 'transparent'"
            [style.color]="isTagSelected(t.id) ? t.color : null"
            (click)="toggleTag(t.id)">
            {{ t.name }}
          </button>
          <p class="empty-hint-small" *ngIf="allTags.length === 0">{{ 'form.noTagsYet' | translate }}</p>
        </div>
      </div>
    </div>

    <p class="form-error" *ngIf="form.invalid && form.touched">{{ 'form.missingFields' | translate }}</p>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="cancel.emit()">{{ 'form.cancel' | translate }}</button>
    <button type="submit" class="btn-primary">{{ 'form.save' | translate }}</button>
  </div>
</form>
