@if (open) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="manager-card">
        <div class="manager-header">
          <h3>{{ 'tags.manage' | translate }}</h3>
          <button type="button" class="close-btn" (click)="close()">✕</button>
        </div>
        <div class="tag-rows">
          @for (t of tags; track t.id) {
            <div class="tag-row">
              <span class="swatch" [style.background]="t.color"></span>
              <span class="tag-name">{{ t.name }}</span>
              <div class="row-actions">
                <button class="icon-btn" (click)="startEdit(t)" title="{{ 'detail.edit' | translate }}">✎</button>
                <button class="icon-btn icon-btn-danger" (click)="delete(t)" title="{{ 'detail.delete' | translate }}">✕</button>
              </div>
            </div>
          }
          @if (tags.length === 0) {
            <p class="empty-hint">{{ 'tags.empty' | translate }}</p>
          }
        </div>
        <div class="divider"></div>
        <h4 class="form-title">{{ editingId ? ('tags.editTitle' | translate) : ('tags.addTitle' | translate) }}</h4>
        <label>
          {{ 'tags.name' | translate }}
          <input type="text" [(ngModel)]="formName" placeholder="{{ 'tags.namePlaceholder' | translate }}" />
        </label>
        <label class="color-label">{{ 'categories.color' | translate }}</label>
        <div class="color-swatches">
          @for (color of colors; track color) {
            <button
              type="button"
              class="color-swatch"
              [class.selected]="formColor === color"
              [style.background]="color"
              (click)="formColor = color">
            </button>
          }
        </div>
        <div class="form-actions">
          @if (editingId) {
            <button type="button" class="btn-secondary" (click)="startAdd()">{{ 'form.cancel' | translate }}</button>
          }
          <button type="button" class="btn-primary" (click)="save()">{{ (editingId ? 'form.save' : 'tags.add') | translate }}</button>
        </div>
      </div>
    </div>
  </div>
}
