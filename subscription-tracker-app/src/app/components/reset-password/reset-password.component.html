<div class="auth-page" vantaBackground="net">
  <div class="lang-switch-wrap">
    <app-theme-switch></app-theme-switch>
    <app-language-switch></app-language-switch>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">
    <h2>{{ 'auth.resetPasswordTitle' | translate }}</h2>

    <label>
      {{ 'auth.newPassword' | translate }}
      <input type="password" formControlName="newPassword" [disabled]="!hasToken" />
    </label>

    <label>
      {{ 'auth.confirmPassword' | translate }}
      <input type="password" formControlName="confirmPassword" [disabled]="!hasToken" />
    </label>

    <p class="error" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched">
      {{ 'auth.passwordMismatch' | translate }}
    </p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

    <button type="submit" [disabled]="form.invalid || isSubmitting || !hasToken">
      {{ 'auth.resetPasswordBtn' | translate }}
    </button>

    <p class="switch">
      <a routerLink="/login">{{ 'auth.backToLogin' | translate }}</a>
    </p>
  </form>
</div>
