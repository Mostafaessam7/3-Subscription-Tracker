<div class="auth-page" vantaBackground="net">
  <div class="lang-switch-wrap">
    <app-theme-switch></app-theme-switch>
    <app-language-switch></app-language-switch>
  </div>

  <div class="auth-card">
    <h2>{{ 'auth.confirmEmailTitle' | translate }}</h2>

    @if (state === 'confirming') {
      <p class="status-message">{{ 'auth.confirmingEmail' | translate }}</p>
    }
    @if (state === 'success') {
      <p class="success">{{ message }}</p>
    }
    @if (state === 'error' || state === 'missingToken') {
      <p class="error">{{ message }}</p>
    }

    <p class="switch">
      <a routerLink="/login">{{ 'auth.backToLogin' | translate }}</a>
    </p>
  </div>
</div>
