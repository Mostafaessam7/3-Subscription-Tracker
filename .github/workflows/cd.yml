name: CD (Azure)

# بيشتغل بس بعد ما CI ينجح على main (مش على كل push مباشرة) - عشان مننشرش كود فشل فيه Build/Test
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write # لازم عشان نقدر نعمل push لـ GitHub Container Registry (ghcr.io)

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      api-image: ${{ steps.meta.outputs.api-image }}
      frontend-image: ${{ steps.meta.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects any tag whose repository name is not lowercase, and github.repository keeps
      # the real casing of both owner and repo ("Mostafaessam7/3-Subscription-Tracker"). Every run
      # failed with:
      #   invalid tag "ghcr.io/Mostafaessam7/3-Subscription-Tracker/api:<sha>":
      #   repository name must be lowercase
      # so no image has ever reached the registry. Workflow expressions have no lowercase filter,
      # so the env values are recomputed here in shell, which does have one.
      - name: Set image tags
        id: meta
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "api-image=${{ env.REGISTRY }}/${repo_lc}/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend-image=${{ env.REGISTRY }}/${repo_lc}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "api-latest=${{ env.REGISTRY }}/${repo_lc}/api:latest" >> "$GITHUB_OUTPUT"
          echo "frontend-latest=${{ env.REGISTRY }}/${repo_lc}/frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api-image }}
            ${{ steps.meta.outputs.api-latest }}

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend-image }}
            ${{ steps.meta.outputs.frontend-latest }}

  # بيقرا الأسرار جوه step (وده مسموح) وبيطلّعها كـ output، عشان الـ if على مستوى الـ job يقدر
  # يستخدمها — الـ secrets context ممنوع في jobs.<id>.if.
  #
  # من غير البوابة دي، وظيفتَي النشر بيفشلوا في كل مرة على ريبو لسه متوصّلش بـ Azure، فالـ
  # workflow بيفضل أحمر على طول — وأحمر على طول يعني محدش بيبصّله، وكمان مفيش حالة خضرا نقدر
  # نطلبها في حماية الفرع.
  config:
    runs-on: ubuntu-latest
    outputs:
      has-api-profile: ${{ steps.check.outputs.has-api-profile }}
      has-frontend-profile: ${{ steps.check.outputs.has-frontend-profile }}
    steps:
      - id: check
        env:
          API_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          FRONTEND_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
        run: |
          [ -n "$API_PROFILE" ] && echo "has-api-profile=true" >> "$GITHUB_OUTPUT" || echo "has-api-profile=false" >> "$GITHUB_OUTPUT"
          [ -n "$FRONTEND_PROFILE" ] && echo "has-frontend-profile=true" >> "$GITHUB_OUTPUT" || echo "has-frontend-profile=false" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy API to Azure Web App
    runs-on: ubuntu-latest
    needs: [build-and-push, config]
    if: ${{ needs.config.outputs.has-api-profile == 'true' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy to Azure Web App (Container)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_API }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          images: ${{ needs.build-and-push.outputs.api-image }}

  deploy-frontend:
    name: Deploy Frontend to Azure Web App
    runs-on: ubuntu-latest
    needs: [build-and-push, config]
    if: ${{ needs.config.outputs.has-frontend-profile == 'true' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy to Azure Web App (Container)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_FRONTEND }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          images: ${{ needs.build-and-push.outputs.frontend-image }}
