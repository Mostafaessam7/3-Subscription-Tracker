# تشغيل النظام كامل محليًا بأمر واحد: docker compose up --build
# ⚠️ ده لتجربة/تطوير محلي بس - للإنتاج الحقيقي استخدم قاعدة بيانات مُدارة (Managed DB) بدل الـ Container ده.
#
# قبل أول تشغيل: انسخ .env.example باسم .env واملأ القيم (راجع .env.example للتفاصيل).
# Docker Compose بيقرا ملف .env في نفس المجلد تلقائيًا - مش محتاج أي إعداد إضافي.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=SubscriptionTrackerDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "SubscriptionTracker.Api"
      Jwt__Audience: "SubscriptionTracker.App"
      Admin__BootstrapKey: "${ADMIN_BOOTSTRAP_KEY}"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  db-data:
